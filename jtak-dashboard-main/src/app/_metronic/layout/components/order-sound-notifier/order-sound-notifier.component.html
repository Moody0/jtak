<!-- Audio Element Fallback -->
<audio id="order-notification-audio-player" preload="auto" src="assets/sounds/new-order.wav"></audio>

<!-- Floating New Order Notification Banners -->
<div class="order-alert-container" *ngIf="recentNewOrders && recentNewOrders.length > 0">
  <ng-container *ngFor="let order of recentNewOrders">
    <div 
      class="order-alert-popup" 
      [class.order-alert-enter]="order.visible" 
      [class.order-alert-leave]="!order.visible"
    >
      <div class="order-alert-card">
        <div class="d-flex align-items-start justify-content-between gap-3">
          <div class="d-flex align-items-center gap-3">
            <div class="order-alert-icon-pulse">
              <svg style="width: 1.5rem; height: 1.5rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
              </svg>
            </div>
            <div>
              <div class="d-flex align-items-center gap-2">
                <span class="order-alert-badge">طلب جديد!</span>
                <span class="order-alert-number">{{ order.order_number }}</span>
              </div>
              <p class="order-alert-amount">
                المبلغ: <span class="order-alert-amount-value">{{ order.total_amount | number:'1.0-0' }} ل.س</span>
              </p>
              <p class="order-alert-customer" *ngIf="order.recipient_name">
                العميل: <span>{{ order.recipient_name }}</span>
              </p>
            </div>
          </div>

          <button 
            type="button" 
            class="order-alert-close" 
            (click)="dismissOrder(order.id)" 
            title="إغلاق"
          >
            <svg style="width: 1.15rem; height: 1.15rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <div class="order-alert-footer">
          <button 
            type="button" 
            class="order-alert-action-btn"
            (click)="openOrder(order.id)"
          >
            <span>فتح ومراجعة الطلب</span>
            <svg style="width: 0.9rem; height: 0.9rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </ng-container>
</div>
