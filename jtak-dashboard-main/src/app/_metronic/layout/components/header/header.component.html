<div
  [ngClass]="headerContainerCssClasses"
  class="d-flex align-items-stretch justify-content-between"
>
  <!-- begin::Aside mobile toggle -->
  <ng-container *ngIf="asideDisplay">
    <div
      class="d-flex align-items-center d-lg-none ms-n3 me-1"
      title="Show aside menu"
    >
      <div
        class="
          btn btn-icon btn-active-light-primary
          w-30px
          h-30px
          w-md-40px
          h-md-40px
        "
        id="kt_aside_mobile_toggle"
      >
        <span
          [inlineSVG]="'./assets/media/icons/duotune/abstract/abs015.svg'"
          class="svg-icon svg-icon-1"
        ></span>
      </div>
    </div>
  </ng-container>
  <!-- end::Aside mobile toggle -->

  <!-- begin::Logo -->
  <div class="d-flex align-items-center flex-grow-1 flex-lg-grow-0">
    <a routerLink="/dashboard" class="d-lg-none">
      <img 
        src="./assets/media/logos/jtak-logo.svg"
        alt="JTAK"
        class="h-30px"
        style="max-height: 30px; width: auto; object-fit: contain;" />
    </a>
  </div>
  <!-- end::Logo -->

  <!-- begin::Desktop Live Status Pill -->
  <div class="d-none d-lg-flex align-items-center flex-grow-1">
    <div class="jtak-header-status-pill">
      <span class="jtak-live-dot" aria-hidden="true"></span>
      <span class="jtak-header-status-text">{{ 'HEADER.WORKSPACE_NAME' | translate }}</span>
      <span class="jtak-header-status-badge">{{ 'HEADER.LIVE_STATUS' | translate }}</span>
    </div>
  </div>
  <!-- end::Desktop Live Status Pill -->

  <!-- begin::Wrapper -->
  <div
    class="d-flex align-items-stretch justify-content-end flex-shrink-0"
  >
    <div class="d-flex align-items-stretch flex-shrink-0">
      <app-topbar class="d-flex align-items-stretch flex-shrink-0"></app-topbar>
    </div>
  </div>
  <!-- end::Wrapper -->
</div>
