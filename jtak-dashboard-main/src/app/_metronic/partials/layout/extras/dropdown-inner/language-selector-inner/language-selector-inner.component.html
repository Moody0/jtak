<div ngbDropdown class="d-inline-block position-relative" [autoClose]="true" [placement]="['bottom-right', 'bottom-left']">
  <button
    ngbDropdownToggle
    type="button"
    class="btn btn-sm jtak-lang-pill"
    [title]="language?.name || 'تغيير لغة النظام'"
  >
    <i class="fas fa-globe jtak-lang-globe" aria-hidden="true"></i>
    <span class="jtak-lang-name">{{ language?.name || 'العربية' }}</span>
    <span class="jtak-lang-code-pill">{{ language?.code || (language?.lang === 'en' ? 'EN' : 'AR') }}</span>
    <i class="fas fa-chevron-down jtak-lang-chevron" aria-hidden="true"></i>
  </button>

  <div
    ngbDropdownMenu
    class="dropdown-menu jtak-lang-menu p-2 border border-gray-200 rounded-3 dropdown-menu-anim-up"
  >
    <div class="jtak-lang-menu-header px-2 py-1 mb-1">
      <span class="fs-8 fw-bold text-muted text-uppercase">لغة الواجهة</span>
    </div>
    <ul class="list-unstyled p-0 mb-0">
      <li *ngFor="let item of languages" class="mb-1">
        <a
          href="javascript:;"
          (click)="setLanguageWithRefresh(item.lang)"
          class="jtak-lang-item d-flex align-items-center justify-content-between py-2 px-3 rounded-2"
          [class.active]="item.active"
        >
          <div class="d-flex align-items-center gap-2">
            <span class="lang-item-badge" [class.badge-active]="item.active">{{ item.code }}</span>
            <div class="d-flex flex-column">
              <span class="lang-item-name">{{ item.name }}</span>
              <span class="lang-item-native text-muted">{{ item.nativeName }}</span>
            </div>
          </div>
          <i *ngIf="item.active" class="fas fa-check text-success fs-7"></i>
        </a>
      </li>
    </ul>
  </div>
</div>
