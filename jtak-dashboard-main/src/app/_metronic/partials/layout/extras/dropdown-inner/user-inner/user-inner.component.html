<ng-container *ngIf="_user">
  <div class="jtak-account-summary">
    <span class="jtak-account-avatar" aria-hidden="true">{{ _user.fullName ? _user.fullName.charAt(0) : 'A' }}</span>
    <div class="d-flex flex-column overflow-hidden">
      <small class="text-muted">{{ 'TOPBAR.SIGNED_IN_AS' | translate }}</small>
      <strong class="text-truncate text-slate-800">{{ _user.fullName }} {{ _user.lastName || '' }}</strong>
      <span class="text-truncate text-muted fs-8 font-monospace">{{ _user.email }}</span>
    </div>
  </div>
  <div class="separator my-2"></div>
  <div class="p-1">
    <button type="button" (click)="logout()" class="btn jtak-signout w-100">
      <i class="fas fa-sign-out-alt me-2" aria-hidden="true"></i>
      <span>{{ 'TOPBAR.SIGN_OUT' | translate }}</span>
    </button>
  </div>
</ng-container>
