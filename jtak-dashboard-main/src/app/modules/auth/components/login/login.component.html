<form class="form w-100" [formGroup]="loginForm" novalidate id="kt_login_signin_form" (ngSubmit)="submit()">
  <div class="jtak-login-heading">
    <span class="jtak-login-kicker">جتك للأعمال</span>
    <h1>{{ 'AUTH.LOGIN.TITLE' | translate }}</h1>
    <p>قم بتسجيل الدخول لإدارة العمليات اليومية.</p>
  </div>

  <div *ngIf="hasError" class="alert alert-danger" role="alert">
    <i class="fas fa-exclamation-circle me-1" aria-hidden="true"></i>
    <span>البريد الإلكتروني أو كلمة المرور غير صحيحة.</span>
  </div>

  <div class="fv-row mb-6">
    <label class="form-label" for="admin-email">{{ 'COMMON.EMAIL' | translate }}</label>
    <input id="admin-email" class="form-control form-control-lg" type="email" name="email"
      formControlName="email" autocomplete="email" placeholder="name@company.com"
      [ngClass]="{ 'is-invalid': loginForm.controls['email'].invalid && loginForm.controls['email'].touched }" />
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
      validation: 'required', message: 'البريد الإلكتروني إلزامي', control: loginForm.controls['email'] }"></ng-container>
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
      validation: 'email', message: 'يرجى إدخال بريد إلكتروني صالح', control: loginForm.controls['email'] }"></ng-container>
  </div>

  <div class="fv-row mb-7">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <label class="form-label mb-0" for="admin-password">{{ 'AUTH.INPUT.PASSWORD' | translate }}</label>
      <a routerLink="/auth/forgot-password" class="jtak-forgot-link">{{ 'AUTH.GENERAL.FORGOT_BUTTON' | translate }}</a>
    </div>
    <input id="admin-password" class="form-control form-control-lg" type="password" name="password"
      autocomplete="current-password" formControlName="password" placeholder="أدخل كلمة المرور"
      [ngClass]="{ 'is-invalid': loginForm.controls['password'].invalid && loginForm.controls['password'].touched }" />
    <ng-container [ngTemplateOutlet]="formError" [ngTemplateOutletContext]="{
      validation: 'required', message: 'كلمة المرور إلزامية', control: loginForm.controls['password'] }"></ng-container>
  </div>

  <button type="submit" id="kt_sign_in_submit" class="btn btn-lg btn-primary w-100" [disabled]="loginForm.invalid">
    <ng-container *ngIf="isLoading$ | async; else signInLabel">
      <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span> {{ 'COMMON.LOADING' | translate }}
    </ng-container>
    <ng-template #signInLabel>{{ 'AUTH.LOGIN.BUTTON' | translate }} <i class="fas fa-arrow-right rtl-flip ms-1" aria-hidden="true"></i></ng-template>
  </button>
  <p class="jtak-login-help">الدخول مخصص حصراً لموظفي ومسؤولي منصة جتك المصرح لهم.</p>
</form>

<ng-template #formError let-control="control" let-message="message" let-validation="validation">
  <div class="fv-plugins-message-container" *ngIf="control.hasError(validation) && (control.dirty || control.touched)">
    <span role="alert" class="text-danger fs-8">{{ message }}</span>
  </div>
</ng-template>
