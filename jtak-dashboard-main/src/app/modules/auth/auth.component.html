<div
  class="
    d-flex
    flex-column flex-column-fluid
    bgi-position-y-bottom
    position-x-center
    bgi-no-repeat bgi-size-contain bgi-attachment-fixed
  "
>
  <!--begin::Content-->
  <div class="d-flex flex-center flex-column flex-column-fluid p-10 pb-lg-20">
    <a routerLink="/" class="mb-12">
      <img alt="JTAK" src="./assets/media/logos/jtak-logo.svg" class="h-45px" style="max-height: 45px; max-width: 170px; width: auto; object-fit: contain;" />
    </a>

    <!--begin::Content body-->
    <div class="w-lg-500px bg-white rounded shadow-sm p-10 p-lg-15 mx-auto">
      <router-outlet></router-outlet>
    </div>
    <!--end::Content body-->
  </div>
  <!--end::Content-->

  <!-- begin::Footer -->
  <div class="d-flex flex-center flex-column-auto p-10">
    <div class="d-flex flex-column align-items-center gap-4">
      <div class="d-flex align-items-center gap-2" role="group" [attr.aria-label]="'TRANSLATOR.SELECT' | translate">
        <button type="button" class="btn btn-sm px-3"
          [ngClass]="currentLanguage === 'ar' ? 'btn-primary' : 'btn-light'"
          (click)="setLanguage('ar')">العربية</button>
        <button type="button" class="btn btn-sm px-3"
          [ngClass]="currentLanguage === 'en' ? 'btn-primary' : 'btn-light'"
          (click)="setLanguage('en')">English</button>
      </div>
    </div>
  </div>
  <!-- end::Footer -->
</div>
