<ng-container *ngIf="isLoading">
  <app-modal-progress></app-modal-progress>
</ng-container>

<div class="modal-header">
  <div class="modal-title h4" *ngIf="moduleName; else fullTitle">
    {{ 'COMMON.DELETE' | translate }} {{ getLocalizedModuleName() }}
  </div>
  <ng-template #fullTitle>
    <div class="modal-title h4">{{ title }}</div>
  </ng-template>
</div>
<div class="modal-body">
  <ng-container *ngIf="isLoading">
    <span>{{ 'COMMON.LOADING' | translate }}</span>
  </ng-container>

  <ng-container *ngIf="!isLoading">
    <span *ngIf="moduleName; else fullConfirmationText">
      {{ 'COMMON.DELETE_CONFIRM_TEXT' | translate }}
    </span>
    <ng-template #fullConfirmationText>
      <span>{{ confirmationText }}</span>
    </ng-template>
  </ng-container>
</div>

<div class="modal-footer">
  <div>
    <button
      type="button"
      class="btn btn-light btn-elevate"
      (click)="onCancelClicked()"
      [disabled]="isLoading"
    >
      {{ 'COMMON.CANCEL' | translate }}
    </button>&nbsp;
    <button
      type="button"
      class="btn btn-danger btn-elevate"
      (click)="onDeleteClicked()"
      [disabled]="isLoading"
    >
      {{ (confirmLabel === 'Delete' ? 'COMMON.DELETE' : confirmLabel) | translate }}
    </button>
  </div>
</div>
