<div class="card card-custom gutter-b">
  <div class="card-header">
    <div class="card-title">
      <div><h3 class="card-label">Users</h3><span class="card-subtitle">Manage customers, staff roles, and account access.</span></div>
    </div>
    <div class="card-toolbar">
      <button type="button" class="btn btn-primary" (click)="create()">
        <i class="fas fa-plus"></i> Add user
      </button>
    </div>
  </div>
  <div class="card-body">
    <!-- begin: Filtration form -->
    <div class="form form-label-right">
      <div class="form-group d-flex justify-content-between">
        <div class="col-lg-2" [formGroup]="searchGroup">
          <input
            type="text"
            class="form-control"
            name="searchText"
            placeholder="Search by name, email, or phone"
            formControlName="searchTerm"
          />
        </div>
      <div>
        <ng-select style="min-width: 150px;" (change)="updateSelectedRole()" [(ngModel)]="selecctedRoleId" class="col-lg-2"
              placeholder="All roles" aria-label="Filter by role">
          <ng-option *ngFor="let role of userRoles" [value]="role.key">{{role.value}}</ng-option>
        </ng-select>
      </div>
      </div>

    </div>
    <!-- end: Filtration form -->

    <ng-container *ngIf="service.items$ | async as items">
      <div class="bulk-action-bar" *ngIf="selection.count > 0" role="region" aria-label="Bulk actions">
        <div class="bulk-selection-count"><strong>{{ selection.count }}</strong> selected</div>
        <div class="bulk-action-buttons">
          <button type="button" class="btn btn-sm btn-light" (click)="bulkSetStatus(items, true)"><i class="fas fa-check-circle"></i> Enable</button>
          <button type="button" class="btn btn-sm btn-light" (click)="bulkSetStatus(items, false)"><i class="fas fa-ban"></i> Disable</button>
          <button type="button" class="btn btn-sm btn-light" (click)="selection.exportSelected(items, 'users')"><i class="fas fa-download"></i> Export</button>
          <button type="button" class="btn btn-sm btn-link" (click)="selection.clear()">Clear</button>
        </div>
      </div>
    </ng-container>

    <div class="table-responsive angular-bootstrap-table mt-10" *ngIf="service.items$ | async as items">
      <table
        class="table table-row-bordered table-row-gray-100 align-middle gs-0 gy-3"
      >
        <thead>
          <tr class="fw-bolder text-muted">
            <th scope="col" class="table-select-cell">
              <input type="checkbox" class="form-check-input" aria-label="Select all users on this page"
                [checked]="selection.allSelected(items)" [indeterminate]="selection.partiallySelected(items)"
                (change)="selection.toggleAll(items, $any($event.target).checked)" />
            </th>
            <th scope="col">Name</th>
            <th scope="col">
              Email
              <app-sort-icon
                column="email"
                [activeColumn]="sorting.column"
                [activeDirection]="sorting.direction"
                (sort)="sort($event)"
              ></app-sort-icon>
            </th>
            <th scope="col">Phone</th>
            <th scope="col">Status</th>
            <th scope="col" style="width: 120px;">ACTIONS</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let i of items" [class.table-row-selected]="selection.isSelected(i)">
            <td class="table-select-cell"><input type="checkbox" class="form-check-input" [checked]="selection.isSelected(i)"
              [attr.aria-label]="'Select ' + i.firstName" (change)="selection.toggle(i, $any($event.target).checked)" /></td>
            <td>{{ i.firstName }}</td>
            <td>{{ i.email }}</td>
            <td>{{ i.phoneNumber }}</td>
            <td>
              <button
                title="Enable / Disable"
                class="badge btn btn-sm"
                [ngClass]="{'badge-light-success': i.isActive,'badge-warning': !i.isActive}"
                (click)="changeUserStatus(i.isActive, i.id)"
              >
                {{ i.isActive ? "Active" : "Disabled" }}
              </button>
            </td>
            <td>
              <app-table-actions
                (editClicked)="edit(i)"
                (deleteClicked)="delete(i.id)"
                [showDeleteButton]="true"
              >
              </app-table-actions>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <app-paginator
      class="d-flex justify-content-between align-items-center flex-wrap"
      [paginator]="paginator"
      [isLoading]="isLoading"
      (paginate)="paginate($event)"
    ></app-paginator>

    <!-- begin:Table -->
  </div>
  <!-- end: Table -->
</div>
