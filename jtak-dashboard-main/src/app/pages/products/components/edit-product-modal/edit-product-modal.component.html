<app-edit-modal [item]="item" [itemName]="item.title" moduleName="Product" [isLoading]="isLoading$ | async"
  [saveDisabled]="formGroup.invalid" (cancelClicked)="modal.dismiss()" (saveClicked)="save()">
  <ng-container *ngIf="item">
    <form class="form jtak-edit-form" [formGroup]="formGroup">
      <section class="edit-section">
        <div class="edit-section-heading"><span>01</span><div><h3>Product details</h3><p>The information customers use to identify this item.</p></div></div>
        <div class="row g-4">
          <div class="col-md-8"><label for="title">Product title</label><app-input-container [control]="formGroup.controls.title"><input type="text" class="form-control" formControlName="title" id="title" placeholder="Enter a clear product name" /></app-input-container></div>
          <div class="col-md-4"><label for="unit">Unit</label><app-input-container [control]="formGroup.controls.unit"><input type="text" class="form-control" formControlName="unit" id="unit" placeholder="Piece, kg, box…" /></app-input-container></div>
          <div class="col-12"><label for="description">Description</label><app-input-container [control]="formGroup.controls.description"><textarea rows="4" class="form-control" formControlName="description" id="description" placeholder="Describe the product and important details"></textarea></app-input-container></div>
          <div class="col-12"><label for="productCategoryId">Category</label><ng-select id="productCategoryId" formControlName="productCategoryId" placeholder="Choose a category"><ng-option *ngFor="let cat of productCategories" [value]="cat.id">{{ cat.title }}</ng-option></ng-select></div>
        </div>
      </section>
      <section class="edit-section">
        <div class="edit-section-heading"><span>02</span><div><h3>Visibility</h3><p>Control how this product appears in the customer app.</p></div></div>
        <div class="settings-grid">
          <label class="setting-toggle"><input type="checkbox" formControlName="active" /><span><strong>Product is active</strong><small>Customers can find and order this product.</small></span></label>
          <label class="setting-toggle"><input type="checkbox" formControlName="isFeatured" /><span><strong>Feature this product</strong><small>Give the item additional visibility in discovery.</small></span></label>
        </div>
      </section>
      <section class="edit-section edit-section--last">
        <div class="edit-section-heading"><span>03</span><div><h3>Product images</h3><p>Use clear, consistent photography. Multiple images are supported.</p></div></div>
        <app-file-uploader uploaderTitle="Choose product images" (fileUploaded)="onFileUploaded($event, 'photos')" [multiple]="true"></app-file-uploader>
        <div class="edit-image-grid"><app-uploaded-image *ngFor="let photo of formGroup.get('photos')?.value" [imageId]="photo" [dimensions]="{ width: 600, height: 300 }" (imageDeleted)="onFileDelete('photos', photo)"></app-uploaded-image></div>
      </section>
    </form>
  </ng-container>
</app-edit-modal>
