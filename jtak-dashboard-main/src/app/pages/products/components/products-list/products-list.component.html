<div class="card card-custom gutter-b">
  <div class="card-header">
    <div class="card-title">
      <div><h3 class="card-label">Products</h3><span class="card-subtitle">Maintain product information, categories, and availability.</span></div>
    </div>
    <div class="card-toolbar">
      <button type="button" class="btn btn-primary" (click)="create()">
        <i class="fas fa-plus"></i> Add product
      </button>
    </div>
  </div>
  <div class="card-body">
    <!-- begin: Filtration form -->
    <div class="form form-label-right">
      <div class="form-group row">
        <div class="col-lg-2" [formGroup]="searchGroup">
          <input type="text" class="form-control" name="searchText" placeholder="Search products" formControlName="searchTerm" />
        </div>
      </div>
    </div>
    <!-- end: Filtration form -->

    <ng-container *ngIf="service.items$ | async as items">
      <div class="bulk-action-bar" *ngIf="selection.count > 0" role="region" aria-label="Bulk actions">
        <div class="bulk-selection-count"><strong>{{ selection.count }}</strong> selected</div>
        <div class="bulk-action-buttons">
          <button type="button" class="btn btn-sm btn-light" (click)="bulkSetStatus(items, true)"><i class="fas fa-check-circle"></i> Enable</button>
          <button type="button" class="btn btn-sm btn-light" (click)="bulkSetStatus(items, false)"><i class="fas fa-ban"></i> Disable</button>
          <button type="button" class="btn btn-sm btn-light" (click)="selection.exportSelected(items, 'products')"><i class="fas fa-download"></i> Export</button>
          <button type="button" class="btn btn-sm btn-link" (click)="selection.clear()">Clear</button>
        </div>
      </div>
    </ng-container>

    <div class="table-responsive angular-bootstrap-table mt-10" *ngIf="service.items$ | async as items">
      <table
        class="table table-row-bordered table-row-gray-100 align-middle gs-0 gy-3"
      >
      <thead>
        <tr>
        <th scope="col" class="table-select-cell"><input type="checkbox" class="form-check-input"
          aria-label="Select all products on this page" [checked]="selection.allSelected(items)"
          [indeterminate]="selection.partiallySelected(items)" (change)="selection.toggleAll(items, $any($event.target).checked)" /></th>
        <th scope="col">Id
          <app-sort-icon
            column="id"
            [activeColumn]="sorting.column"
            [activeDirection]="sorting.direction"
            (sort)="sort($event)"
          ></app-sort-icon></th>
        <th scope="col">Title
          <app-sort-icon
            column="title"
            [activeColumn]="sorting.column"
            [activeDirection]="sorting.direction"
            (sort)="sort($event)"
          ></app-sort-icon></th>
        <th scope="col">Product Category
          <app-sort-icon
            column="productCategory"
            [activeColumn]="sorting.column"
            [activeDirection]="sorting.direction"
            (sort)="sort($event)"
          ></app-sort-icon></th>
        <th scope="col" style="width: 120px;">ACTIONS</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of items" [class.table-row-selected]="selection.isSelected(product)">
          <td class="table-select-cell"><input type="checkbox" class="form-check-input" [checked]="selection.isSelected(product)"
            [attr.aria-label]="'Select ' + product.title" (change)="selection.toggle(product, $any($event.target).checked)" /></td>
          <td>{{ product.id }}</td>
          <td>{{ product.title }}</td>
          <td>{{ product.productCategory }}</td>
          <td>
            <app-table-actions (editClicked)="edit(product)"
            [showDeleteButton]="false">
              
              <button
              title="Enable / Disable"
              class="btn btn-icon btn-light btn-hover-danger btn-sm"
              (click)="changeStatus(product.active, product.id)"
            >
              <span
                class="fas"
                [ngClass]="{
                  'fa-ban': product.active,
                  'fa-check': !product.active
                }"
              ></span>
            </button>
            </app-table-actions>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <!-- end: Table -->

  <app-paginator class="d-flex justify-content-between align-items-center flex-wrap" [paginator]="paginator"
    [isLoading]="isLoading" (paginate)="paginate($event)"></app-paginator>
</div>
