<div class="card card-custom gutter-b">
  <div class="card-header">
    <div class="card-title">
      <div><h3 class="card-label">Categories</h3><span class="card-subtitle">Organize how customers browse the catalog.</span></div>
    </div>
    <div class="card-toolbar">
      <button type="button" class="btn btn-primary" (click)="create()">
        <i class="fas fa-plus"></i> Add category
      </button>
    </div>
  </div>
  <div class="card-body">
    <!-- begin: Filtration form -->
    <div class="form form-label-right">
      <div class="form-group row">
        <div class="col-lg-2" [formGroup]="searchGroup">
          <input type="text" class="form-control" name="searchText" placeholder="Search categories" formControlName="searchTerm" />
        </div>
      </div>
    </div>
    <!-- end: Filtration form -->
    <ng-container *ngIf="service.items$ | async as items">
      <div class="bulk-action-bar" *ngIf="selection.count > 0">
        <div class="bulk-selection-count"><strong>{{ selection.count }}</strong> selected</div>
        <div class="bulk-action-buttons"><button type="button" class="btn btn-sm btn-light" (click)="selection.exportSelected(items, 'categories')"><i class="fas fa-download"></i> Export</button><button type="button" class="btn btn-sm btn-danger" (click)="bulkDelete(items)"><i class="fas fa-trash"></i> Delete</button><button type="button" class="btn btn-sm btn-link" (click)="selection.clear()">Clear</button></div>
      </div>
    </ng-container>

    <div class="table-responsive angular-bootstrap-table mt-6" *ngIf="service.items$ | async as items">
      <table
        class="table table-row-bordered table-row-gray-100 align-middle gs-0 gy-3"
      >
      <thead>
        <tr>
          <th scope="col" class="table-select-cell"><input type="checkbox" class="form-check-input" aria-label="Select all categories on this page" [checked]="selection.allSelected(items)" [indeterminate]="selection.partiallySelected(items)" (change)="selection.toggleAll(items, $any($event.target).checked)" /></th>
          <th scope="col" style="width: 50px;">Icon</th>
          <th scope="col" style="width: 60px;">Id</th>
          <th scope="col">Title</th>
          <th scope="col">Level / Placement</th>
          <th scope="col" style="width: 90px;">Order</th>
          <th scope="col" style="width: 90px;">Status</th>
          <th scope="col" style="width: 120px;">ACTIONS</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of items" [class.table-row-selected]="selection.isSelected(product)">
          <td class="table-select-cell"><input type="checkbox" class="form-check-input" [checked]="selection.isSelected(product)" [attr.aria-label]="'Select ' + product.title" (change)="selection.toggle(product, $any($event.target).checked)" /></td>
          <td>
            <div style="width: 42px; height: 42px; border-radius: 8px; overflow: hidden; background: #f3f4f6; display: flex; align-items: center; justify-content: center;">
              <app-uploaded-image *ngIf="product.icon && !product.icon.startsWith('fas ')" [imageId]="product.icon" [showDeleteButton]="false" [dimensions]="{ width: 42, height: 42 }"></app-uploaded-image>
              <i *ngIf="product.icon && product.icon.startsWith('fas ')" [class]="product.icon" style="font-size: 20px; color: #f97316;"></i>
              <i *ngIf="!product.icon" class="fas fa-image text-muted" style="font-size: 18px;"></i>
            </div>
          </td>
          <td>{{ product.id }}</td>
          <td><span class="fw-bolder fs-6 text-dark">{{ product.title }}</span></td>
          <td>
            <span *ngIf="!product.parentId" class="badge badge-light-primary fw-bolder">🏠 Home Page (Main)</span>
            <span *ngIf="product.parentId" class="badge badge-light-secondary">Subcategory</span>
          </td>
          <td>
            <span class="badge badge-light-info fw-bold fs-7">{{ product.order ?? 0 }}</span>
          </td>
          <td>
            <span *ngIf="product.active" class="badge badge-light-success">Active</span>
            <span *ngIf="!product.active" class="badge badge-light-danger">Inactive</span>
          </td>
          <td>
            <app-table-actions (editClicked)="edit(product)" (deleteClicked)="delete(product.id)"></app-table-actions>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <!-- end: Table -->

  <app-paginator class="d-flex justify-content-between align-items-center flex-wrap" [paginator]="paginator"
    [isLoading]="isLoading" (paginate)="paginate($event)"></app-paginator>
</div>
