name: Deploy Backend to Production

on:
  push:
    branches:
      - release/jtak-production
      - main
    paths:
      - 'jtak-backend-main/**'
      - '.github/workflows/deploy-backend.yml'
      - 'tools/manage-app-offline.cjs'
  workflow_dispatch:

jobs:
  build:
    name: 🔨 Build Backend
    runs-on: windows-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 🔨 Publish .NET Backend
        run: |
          dotnet publish jtak-backend-main/app/app.csproj -c Release -o ./publish-backend --no-self-contained

      - name: 📦 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ./publish-backend/
          retention-days: 1

  deploy:
    name: 🚀 Deploy Backend via FTP
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository (for scripts)
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: 📦 Install FTP Helper Dependencies
        run: |
          npm install --no-save basic-ftp

      - name: ⏸️ Take App Offline (Release IIS DLL Locks)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_BACKEND_DIR: ${{ vars.FTP_BACKEND_DIR || 'api.jtak.app/' }}
        run: |
          node tools/manage-app-offline.cjs offline

      - name: ⬇️ Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: ./publish-backend

      - name: 🚀 Deploy via FTP to api.jtak.app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_BACKEND_DIR || 'api.jtak.app/' }}
          local-dir: ./publish-backend/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/appsettings*.json
            **/web.config
            **/FileCenter/**
            **/uploads/**
            **/logs/**
            **/keys/**
            **/*.pdb
            app_offline.htm

      - name: ▶️ Bring App Online (Reload IIS with New DLLs)
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_BACKEND_DIR: ${{ vars.FTP_BACKEND_DIR || 'api.jtak.app/' }}
        run: |
          node tools/manage-app-offline.cjs online
